name: Sync and deploy

# The daily rebuild — which pulls the latest Google Docs and study PDFs and
# redeploys Pages — runs at 14:00 UTC, but the schedule is no longer here. The
# workflow-trigger Worker dispatches it.
#
# GitHub queues scheduled events best-effort. Across the 98 daily runs to 30
# August not one started within fifteen minutes of the 14:00 slot: the median
# was 66 minutes late, and from 27 August the median became 6.7 hours with a
# worst case of 9.6 hours. A dispatched run starts within seconds.
#
# To change when the rebuild runs, edit wrangler.jsonc and JOBS in
# workflow-trigger. Pushes to main still deploy immediately, as before.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync Google Docs and study PDFs
        run: npm run sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SYNC_REQUIRED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - run: npm test

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
